{% extends "_base.html" %}
{% block title %}首次登录 · 修改密码{% endblock %}

{% block content %}
<div class="page" style="max-width: 480px;">
    <div class="page-eyebrow">First-Time Setup</div>
    <h1 class="page-title">请立即修改默认密码</h1>
    <p class="page-subtitle">
        当前使用默认凭据登录,在改密前无法访问其它管理功能。
    </p>

    <div class="panel">
        <div class="panel-header">
            <div>
                <div class="panel-eyebrow">Security</div>
                <h2 class="panel-title">修改管理员密码</h2>
            </div>
        </div>
        <div class="panel-body">
            <form method="post" action="{{ url_for('settings') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="current_password" class="form-label">当前密码</label>
                    <input type="password" class="form-control" id="current_password"
                           name="current_password" required autocomplete="current-password">
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label">新密码 (至少 8 位)</label>
                    <input type="password" class="form-control" id="new_password"
                           name="new_password" required minlength="8" autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">确认新密码</label>
                    <input type="password" class="form-control" id="confirm_password"
                           name="confirm_password" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i> 更新密码
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
