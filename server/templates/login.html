{% extends "_base.html" %}
{% block title %}管理员登录{% endblock %}

{% block extra_head %}
<style>
    body {
        min-height: 100vh;
        display: flex; flex-direction: column;
    }
    .login-page {
        flex: 1; display: flex; align-items: center; justify-content: center;
        padding: 32px 16px;
    }
    .login-card {
        width: 100%; max-width: 380px;
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        padding: 32px 28px;
    }
    .login-icon {
        width: 56px; height: 56px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: var(--accent-bg);
        display: flex; align-items: center; justify-content: center;
        color: var(--accent); font-size: 26px;
    }
    .login-form .form-control {
        border-radius: var(--radius-sm);
    }
    .login-form .form-control:focus {
        box-shadow: 0 0 0 3px var(--accent-bg);
        border-color: var(--accent);
    }
    .login-submit {
        width: 100%;
        background: var(--accent); border-color: var(--accent); color: white;
        padding: 10px;
        border-radius: var(--radius-md); font-weight: 500;
        margin-top: 4px;
    }
    .login-submit:hover {
        background: var(--accent-hover); border-color: var(--accent-hover); color: white;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="text-center">
            <div class="login-icon"><i class="bi bi-shield-lock"></i></div>
            <div class="page-eyebrow">Admin Access</div>
            <h1 class="page-title" style="font-size: 22px; margin-bottom: 24px;">管理员登录</h1>
        </div>

        {% if error %}
        <div class="flash flash-danger">{{ error }}</div>
        {% endif %}

        <form method="post" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="username" class="form-label" style="font-size: 13px; color: var(--text-secondary);">用户名</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label" style="font-size: 13px; color: var(--text-secondary);">密码</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn login-submit">
                <i class="bi bi-box-arrow-in-right me-1"></i> 登录
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/" class="nav-link" style="display: inline-block;">
                <i class="bi bi-arrow-left"></i> 返回仪表盘
            </a>
        </div>
    </div>
</div>
{% endblock %}

{# 登录页不需要顶部导航条 #}
{% block topbar %}{% endblock %}
